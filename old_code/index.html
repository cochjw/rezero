
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SikJaeRyo Gacha</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9106df1779f54e317ab7edfc1a2eae5e&libraries=services"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'cute': ['Jua', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#fff7ed',
                100: '#ffedd5',
                200: '#fed7aa',
                300: '#fdba74',
                400: '#fb923c',
                500: '#f97316',
                600: '#ea580c',
                700: '#c2410c',
                800: '#9a3412',
                900: '#7c2d12',
              }
            },
            animation: {
              'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both infinite',
              'pop': 'pop 0.3s ease-out forwards',
              'drop-in': 'drop-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
              'vortex': 'vortex 2s linear infinite',
              'flash': 'flash 0.5s ease-out forwards',
              'implode': 'implode 0.5s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards',
              'spin-slow': 'spin 8s linear infinite',
              'spin-reverse': 'spin-reverse 12s linear infinite',
              'float': 'float 3s ease-in-out infinite',
              'glint': 'glint 2s infinite',
              'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              shake: {
                '0%, 100%': { transform: 'rotate(0deg)' },
                '25%': { transform: 'rotate(-5deg)' },
                '75%': { transform: 'rotate(5deg)' }
              },
              pop: {
                '0%': { transform: 'scale(0.5)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' }
              },
              'drop-in': {
                '0%': { transform: 'translateY(-100%) scale(0.5)', opacity: '0' },
                '60%': { transform: 'translateY(10%) scale(1.1)', opacity: '1' },
                '100%': { transform: 'translateY(0) scale(1)', opacity: '1' }
              },
              vortex: {
                '0%': { transform: 'rotate(0deg) scale(1)' },
                '100%': { transform: 'rotate(360deg) scale(1.5)' }
              },
              flash: {
                '0%': { opacity: '0' },
                '50%': { opacity: '1' },
                '100%': { opacity: '0' }
              },
              implode: {
                '0%': { transform: 'scale(1)', opacity: '1' },
                '100%': { transform: 'scale(0)', opacity: '0' }
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' }
              },
              glint: {
                '0%': { transform: 'translateX(-150%) skewX(-20deg)' },
                '100%': { transform: 'translateX(150%) skewX(-20deg)' }
              },
              'spin-reverse': {
                '0%': { transform: 'rotate(360deg)' },
                '100%': { transform: 'rotate(0deg)' }
              },
              'pulse-glow': {
                '0%, 100%': { opacity: '1', filter: 'brightness(100%) blur(0px)' },
                '50%': { opacity: '.8', filter: 'brightness(150%) blur(2px)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #f8fafc;
        touch-action: manipulation;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .energy-swirl {
        background: radial-gradient(circle, rgba(168,85,247,0.4) 0%, rgba(79,70,229,0) 70%);
      }
      .glint-effect {
        background: linear-gradient(
          to right,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.05) 40%,
          rgba(255, 255, 255, 0.8) 50%,
          rgba(255, 255, 255, 0.05) 60%,
          rgba(255, 255, 255, 0) 100%
        );
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "leaflet": "https://esm.sh/leaflet@^1.9.4"
  }
}
</script>
